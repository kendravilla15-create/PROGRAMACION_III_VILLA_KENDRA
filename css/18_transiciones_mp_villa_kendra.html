<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>GymFit - Transiciones</title>
    <link rel="stylesheet" href="18_transiciones_mp_villa_kendra.css">
</head>
<body>
    <main>
        <h1>Gimnasio GymFit</h1>
        <p>Coloca el cursor sobre el botón</p>
        <button class="boton-entrenar">
            Iniciar Entrenamiento
        </button>
        <div class="tarjeta">
            <h2>Carlos Pérez</h2>
            <p>Entrenador de fuerza</p>
        </div>

        <h1>Sala de Pesas</h1>
        <div class="sala">
            <div class="pesa">Mancuerna</div>
        </div>
        <div class="sala2">
            <div class="pesa2">Barra</div>
        </div>

        <h1>Cronómetro</h1>
        <div class="cronometro">
            <div class="aguja">⮞</div>
        </div>

        <h1>Carrera de Calentamiento</h1>
        <div class="pista">
            <div class="corredor">Corredor</div>
        </div>
        <div class="pista">
            <div class="corredor2">Corredor 2</div>
        </div>
        <div class="alerta">
            Descanso de 60 segundos
        </div>
    </main>
</body>
</html>
