<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>GymFit - Entrenamiento Animado</title>
    <link rel="stylesheet" href="19_transiciones_integracion_mp_villa_kendra.css">
</head>
<body>
    <header>
        <h1>Entrenamiento GymFit</h1>
        <p>
            Simulación de una sesión
            de cardio en el gimnasio.
        </p>
    </header>
    <main>
        <section class="escena"
                 aria-label="Escena de entrenamiento animada">
            <div class="luz luz1"></div>
            <div class="luz luz2"></div>
            <div class="luz luz3"></div>
            <div class="luz luz4"></div>
            <div class="luz luz5"></div>
            <div class="atleta">
                <span aria-hidden="true">🏃</span>
                <p>Atleta</p>
            </div>
            <div class="alerta">
                ¡HIDRÁTATE!
            </div>
        </section>
        <section class="controles">
            <h2>Panel de entrenamiento</h2>
            <div class="panel">
                <article class="cronometro-contenedor">
                    <h3>Ritmo Cardíaco</h3>
                    <div class="cronometro"
                         aria-hidden="true">
                        <div class="pulso"></div>
                        <div class="centro"></div>
                    </div>
                </article>
                <article class="estado">
                    <h3>Estado de la sesión</h3>
                    <p>
                        Sesión de cardio activa.
                    </p>
                    <p>
                        Máquina: Caminadora
                    </p>
                    <p>
                        Entrenadora: Ana Torres
                    </p>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <p>Gimnasio GymFit - 2026</p>
    </footer>
</body>
</html>
