<!DOCTYPE html>     
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
</head>
<body>
    <img src="images/yoda.webp" alt="Maestro Yoda">
    <title>Imagenes</title>
    <h1>Utilizacion de la etiqueta Img</h1>
    
    <img
    src="../images/personajes/ahsoka.jpg"
    alt="ahsoka tano"
    width="300"
    height="350"
    loading="lazy"
    >  

    <img
    src="https://static.wikia.nocookie.net/starwars/images/c/c3/Yoda_TPM_RotS.png/revision/latest/thumbnail/width/360/height/360?cb=20130810185858"
    alt="Imagen 1"
    width="300"
    height="350"
    loading="eager"
    > 
    
    <img
    src="../images/personajes/luke.jpg"
    alt="Luke y Yoda"
    width="300"
    height="350"
    loading="lazy"
    >  
    
    <figure>
     <img
        src="../images2/yoda_grande.jpeg"
        alt="Maestro Yoda"
        width="300"
        height="350"
        loading="eager">
        <figcaption>
            Mestro Yoda, integrente del consejo Jedi
        </figcaption>
    </figure>
    <a href="https://www.starwars.com/"
        target="_blank"
        >
        <img 
        src="../images/logo.svg"
        alt="Logo Star Wars"
        width="200"
        >
    </a>
</body>
</html>
