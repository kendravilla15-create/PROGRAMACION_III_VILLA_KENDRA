<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>     
<body>
    <h1>Listas en HTML</h1>
    <h1>Lista desordenada</h1>
    <!-- ul= unordered list -->
    <ul>
        <li>Luke Skywalker</li>
        <li>Leia Organa</li>
        <li>Han Solo</li>
        <li>Darth Vader</li>
    </ul>
    <h1>Lista ordenada</h1>
    <!-- ol= ordered list -->   
    <ol>
        <li>Luke Skywalker</li>
        <li>Leia Organa</li>
        <li>Han Solo</li>
        <li>Darth Vader</li>
    </ol>
</body>
