<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFit - Imagenes</title>
</head>
<body>
    <img src="images/gymfit/sala_maquinas.jpg" alt="Sala de máquinas GymFit">
    <h1>Utilizacion de la etiqueta Img</h1>

    <img
    src="images/gymfit/peso_muerto.jpg"
    alt="Peso muerto con barra"
    width="300"
    height="350"
    loading="lazy"
    >

    <img
    src="https://media.gettyimages.com/id/2202976374/es/foto/moderno-gimnasio-con-m%C3%A1quinas-de-ejercicios.jpg?s=612x612&w=gi&k=20&c=8DzFsL7B16_v8GJ6fOgOllxdGLv79tQxTD4vv67AAC0="
    alt="Gimnasio moderno con máquinas"
    width="300"
    height="350"
    loading="eager"
    >

    <img
    src="images/gymfit/abdominales.jpg"
    alt="Ejercicio de abdominales"
    width="300"
    height="350"
    loading="lazy"
    >

    <figure>
        <img
        src="images/gymfit/mancuernas.jpg"
        alt="Zona de mancuernas"
        width="300"
        height="350"
        loading="eager">
        <figcaption>
            Zona de peso libre del Gimnasio GymFit
        </figcaption>
    </figure>
    <a href="https://www.smartfit.com.ec/"
        target="_blank"
        >
        <img
        src="images/gymfit/logo_gymfit.svg"
        alt="Logo GymFit"
        width="200"
        >
    </a>
</body>
</html>
