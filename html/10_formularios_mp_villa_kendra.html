<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFit - Formularios</title>
</head>
<body>
    <form action="/registro" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" id="nombre">
        <label for="apellido">Apellido:</label>
        <input type="text" name="apellido" id="apellido">
        <label for="password">Password:</label>
        <input type="password" name="password" id="password">
        <label for="password2">Confirmar Password:</label>
        <input type="password" name="password2" id="password2">
        <button type="submit">Enviar</button>
    </form>

    <form action="/registro" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre_socio">Nombre:</label>
                    <input
                        type="text"
                        name="nombre"
                        id="nombre_socio"
                        placeholder="Ej:Kendra"
                    required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="apellido_socio">Apellido:</label>
                    <input
                        type="text"
                        name="apellido"
                        id="apellido_socio"
                        placeholder="Ej:Villa"
                    required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="password_socio">Password:</label>
                    <input type="password" name="password" id="password_socio">
                </td>
            </tr>
            <tr>
                <td><label for="password2_socio">Confirmar Password:</label></td>
                <td><input type="password" name="password2" id="password2_socio"></td>
            </tr>
            <tr>
                <td>
                    <label for="edad">Edad:</label><br>
                    <input type="number" name="edad" id="edad">
                </td>
                <td>
                    <label for="nivel">Nivel de condición física:</label><br>
                    <input
                        type="number"
                        name="nivel"
                        id="nivel"
                        min="10"
                        max="100"
                        value="50"
                        step="5">
                </td>
            </tr>
            <tr>
                <td>
                    <p>Seleccione su plan:</p>
                    <input type="radio" id="mensual" name="plan" value="mensual">
                    <label for="mensual">Mensual</label>
                    <input type="radio" id="anual" name="plan" value="anual">
                    <label for="anual">Anual</label>
                </td>
                <td>
                    <p>Seleccione sus actividades:</p>
                    <input
                        type="checkbox"
                        id="pesas"
                        name="actividades"
                        value="pesas">
                    <label for="pesas">Pesas</label>
                    <input
                        type="checkbox"
                        id="cardio"
                        name="actividades"
                        value="cardio">
                    <label for="cardio">Cardio</label>
                    <input
                        type="checkbox"
                        id="spinning"
                        name="actividades"
                        value="spinning">
                    <label for="spinning">Spinning</label>
                    <input
                        type="checkbox"
                        id="yoga"
                        name="actividades"
                        value="yoga">
                    <label for="yoga">Yoga</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="horario">Horario de entrenamiento:</label><br>
                    <select name="horario" id="horario" required>
                        <option value="">
                            Selecciona un Horario
                        </option>
                        <option value="manana">
                            Mañana
                        </option>
                        <option value="tarde">
                            Tarde
                        </option>
                        <option value="noche">
                            Noche
                        </option>
                    </select>
                </td>
                <td>
                    <label for="entrenador">Entrenador:</label><br>
                    <select name="entrenador" id="entrenador" multiple size="2">
                        <option value="" selected>
                            Selecciona un Entrenador
                        </option>
                        <option value="carlos">
                            Carlos Pérez
                        </option>
                        <option value="ana">
                            Ana Torres
                        </option>
                        <option value="luis">
                            Luis Gómez
                        </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <fieldset>
                        <legend>Datos Generales:</legend>
                        <label for="peso">Peso (kg):</label><br>
                        <input type="number" id="peso" name="peso">
                        <br>
                        <label for="estatura">Estatura (cm):</label><br>
                        <input type="number" id="estatura" name="estatura">
                    </fieldset>
                </td>
            </tr>
        </table>

        <button type="submit">Enviar</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
